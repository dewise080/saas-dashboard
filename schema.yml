openapi: 3.1.0
info:
  title: GMaps Leads AI Email API
  version: 1.0.0
  description: "\nAPI for AI-driven email outreach based on Google Maps lead data.\n\n##
    Workflow\n\n1. **AI fetches lead context** via `GET /api/gmaps-leads/{id}/context/`\n2.
    **AI generates personalized email** using the business information\n3. **AI posts
    email template** via `POST /api/gmaps-leads/{id}/email-template/`\n4. **Signal
    emitted** when `mark_ready=true` - template ready for human review\n5. **Human
    reviews** in admin panel and approves/rejects\n\n## Key Endpoints\n\n- `GET /api/gmaps-leads/with-emails/`
    - Find leads ready for outreach\n- `GET /api/gmaps-leads/{id}/context/` - Get
    comprehensive lead data for AI\n- `POST /api/gmaps-leads/{id}/email-template/`
    - Submit AI-generated email\n- `PATCH /api/email-templates/{id}/status/` - Update
    template status\n    "
paths:
  /api/gmaps-leads/ai/campaigns/:
    get:
      operationId: aiListCampaigns
      description: Returns campaigns in ready/running status (use status query param
        to override).
      summary: 'AI: List ongoing campaigns'
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: 'Optional status filter (comma-separated). Default: ready,running'
      tags:
      - AI Campaigns
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AICampaign'
          description: ''
  /api/gmaps-leads/ai/campaigns/{campaign_id}/recipients/:
    get:
      operationId: aiListCampaignRecipients
      description: Returns recipients for a campaign. Filter by status and limit for
        batching.
      summary: 'AI: List campaign recipients'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Max results (default 50)
      - in: query
        name: status
        schema:
          type: string
        description: 'Optional status filter (comma-separated). Default: pending'
      tags:
      - AI Campaigns
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AICampaignRecipientList'
          description: ''
  /api/gmaps-leads/ai/campaigns/{campaign_id}/recipients/{recipient_id}/content/:
    post:
      operationId: aiSubmitCampaignRecipientContent
      description: Attach subject/body to a campaign recipient. Sets status to ready
        when mark_ready=true (default).
      summary: 'AI: Submit rendered email content'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      - in: path
        name: recipient_id
        schema:
          type: integer
        required: true
      tags:
      - AI Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AICampaignRecipientContent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AICampaignRecipientContent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AICampaignRecipientContent'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICampaignRecipientContext'
          description: ''
  /api/gmaps-leads/ai/campaigns/{campaign_id}/recipients/{recipient_id}/context/:
    get:
      operationId: aiGetCampaignRecipientContext
      description: Returns recipient context (lead/company/site text) for AI to render
        personalized email.
      summary: 'AI: Get campaign recipient context'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      - in: path
        name: recipient_id
        schema:
          type: integer
        required: true
      tags:
      - AI Campaigns
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICampaignRecipientContext'
          description: ''
  /api/gmaps-leads/ai/campaigns/{campaign_id}/recipients/status/:
    get:
      operationId: aiCampaignRecipientStatus
      description: Returns counts and recipient IDs grouped by status. Filter with
        status param (comma-separated).
      summary: 'AI: Recipient status counts'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: 'Optional status filter (comma-separated). Default: pending'
      tags:
      - AI Campaigns
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICampaignRecipientStatus'
          description: ''
  /api/gmaps-leads/ai/memory/:
    get:
      operationId: ai_memory_list
      description: 'GET: List all memories. POST: Create a new memory (note or progress).'
      summary: List AI memories
      tags:
      - AI Assistant Memory
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIMemory'
          description: ''
    post:
      operationId: ai_memory_create
      description: 'GET: List all memories. POST: Create a new memory (note or progress).'
      summary: Create AI memory
      tags:
      - AI Assistant Memory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIMemory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIMemory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIMemory'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIMemory'
          description: ''
  /api/gmaps-leads/waha/campaigns/:
    get:
      operationId: api_gmaps_leads_waha_campaigns_list
      description: Create/list WhatsApp campaigns scoped by scrape job.
      summary: List WhatsApp campaigns
      parameters:
      - in: query
        name: job_id
        schema:
          type: integer
        description: Filter by scrape job id
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WhatsAppCampaign'
          description: ''
    post:
      operationId: api_gmaps_leads_waha_campaigns_create
      description: Create/list WhatsApp campaigns scoped by scrape job.
      summary: Create WhatsApp campaign
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppCampaign'
          description: ''
  /api/gmaps-leads/waha/campaigns/{campaign_id}/prepare/:
    post:
      operationId: api_gmaps_leads_waha_campaigns_prepare_create
      description: Generate recipients for a campaign without sending.
      summary: Prepare WhatsApp campaign recipients
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gmaps-leads/waha/campaigns/{campaign_id}/recipients/:
    get:
      operationId: api_gmaps_leads_waha_campaigns_recipients_list
      description: List recipients for a campaign.
      summary: List WhatsApp campaign recipients
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WhatsAppCampaignRecipient'
          description: ''
  /api/gmaps-leads/waha/campaigns/{campaign_id}/run/:
    post:
      operationId: api_gmaps_leads_waha_campaigns_run_create
      description: 'Run a WhatsApp campaign: build recipients from job leads, then
        send with jitter and throttle.'
      summary: Run WhatsApp campaign
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppCampaign'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '206':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gmaps-leads/waha/messages/send/:
    post:
      operationId: api_gmaps_leads_waha_messages_send_create
      description: Send a WhatsApp text message via WAHA.
      summary: Send WhatsApp text via WAHA
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahaSendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WahaSendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WahaSendMessage'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gmaps-leads/waha/messages/test/:
    post:
      operationId: api_gmaps_leads_waha_messages_test_create
      description: 'Test helper: preview (dry_run) or send a single message using
        template pools/templates/campaigns.'
      summary: Preview or send a test WhatsApp message via WAHA
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahaTestMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WahaTestMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WahaTestMessage'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '206':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gmaps-leads/waha/template-pools/:
    get:
      operationId: api_gmaps_leads_waha_template_pools_list
      description: List/create WhatsApp template pools.
      summary: List WhatsApp template pools
      parameters:
      - in: query
        name: job_id
        schema:
          type: integer
        description: Filter by job id
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WhatsAppTemplatePool'
          description: ''
    post:
      operationId: api_gmaps_leads_waha_template_pools_create
      description: List/create WhatsApp template pools.
      summary: Create WhatsApp template pool
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplatePool'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplatePool'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplatePool'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplatePool'
          description: ''
  /api/gmaps-leads/waha/templates/:
    get:
      operationId: api_gmaps_leads_waha_templates_list
      description: List/create WhatsApp templates.
      summary: List WhatsApp templates
      parameters:
      - in: query
        name: pool_id
        schema:
          type: integer
        description: Filter by pool id
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WhatsAppTemplate'
          description: ''
    post:
      operationId: api_gmaps_leads_waha_templates_create
      description: List/create WhatsApp templates.
      summary: Create WhatsApp template
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplate'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppTemplate'
          description: ''
components:
  schemas:
    AICampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/AICampaignStatusEnum'
        provider_alias:
          type: string
          description: Matches a key from EMAIL_PROVIDERS.
          maxLength: 100
        expected_recipients:
          type: integer
        sent_count:
          type: integer
        failed_count:
          type: integer
        skipped_count:
          type: integer
        progress_percent:
          type: number
          format: double
          readOnly: true
        last_dispatched_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - progress_percent
    AICampaignRecipientContent:
      type: object
      properties:
        subject:
          type: string
        body_html:
          type: string
        body_text:
          type: string
        mark_ready:
          type: boolean
          default: true
      required:
      - body_html
      - subject
    AICampaignRecipientContext:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        campaign_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusDdeEnum'
        email:
          type: string
          format: email
          readOnly: true
        business_name:
          type: string
          readOnly: true
        category:
          type:
          - string
          - 'null'
          readOnly: true
        website:
          type: string
          readOnly: true
        full_text:
          type: string
          readOnly: true
        context: {}
        subject:
          type: string
          maxLength: 500
        body_html:
          type: string
        body_text:
          type: string
      required:
      - business_name
      - campaign_id
      - category
      - email
      - full_text
      - id
      - website
    AICampaignRecipientList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        campaign_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusDdeEnum'
        email:
          type: string
          format: email
          readOnly: true
        business_name:
          type: string
          readOnly: true
        category:
          type:
          - string
          - 'null'
          readOnly: true
      required:
      - business_name
      - campaign_id
      - category
      - email
      - id
    AICampaignRecipientStatus:
      type: object
      properties:
        pending:
          type: integer
        ready:
          type: integer
        rendered:
          type: integer
        sending:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
      required:
      - failed
      - pending
      - ready
      - rendered
      - sending
      - sent
      - skipped
    AICampaignStatusEnum:
      enum:
      - draft
      - ready
      - running
      - paused
      - completed
      - stopped
      type: string
      description: |-
        * `draft` - Draft
        * `ready` - Ready
        * `running` - Running
        * `paused` - Paused
        * `completed` - Completed
        * `stopped` - Stopped
    AIMemory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        memory_type:
          $ref: '#/components/schemas/MemoryTypeEnum'
        content:
          type: string
          description: Details of the memory or progress status (e.g., campaign id,
            done/left counts, notes, etc.)
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - memory_type
    MemoryTypeEnum:
      enum:
      - note
      - progress
      type: string
      description: |-
        * `note` - Note
        * `progress` - Progress Status
    StatusDdeEnum:
      enum:
      - pending
      - ready
      - rendered
      - sending
      - sent
      - failed
      - skipped
      type: string
      description: |-
        * `pending` - Pending
        * `ready` - Ready
        * `rendered` - Rendered
        * `sending` - Sending
        * `sent` - Sent
        * `failed` - Failed
        * `skipped` - Skipped
    WahaSendMessage:
      type: object
      description: Request payload for sending a WhatsApp message via WAHA.
      properties:
        chat_id:
          type: string
          description: WhatsApp chatId (e.g., 905XXXXXXXX@c.us). Optional if phone
            or lead_id is provided.
        phone:
          type: string
          description: Digits-only phone number; formatted to chatId automatically
            if chat_id not provided.
        lead_id:
          type: integer
          description: Resolve the chatId from this lead's WhatsAppContact (creates
            one if possible).
        text:
          type: string
          description: Message text to send.
        quoted_message_id:
          type: string
          description: Optional WAHA message id to quote/reply to.
      required:
      - text
    WahaTestMessage:
      type: object
      description: |-
        Preview or send a single WhatsApp message using a template/pool/campaign context.
        Designed for testing message shape (text/media) without running a whole campaign.
      properties:
        chat_id:
          type: string
          description: e.g., 905XXXXXXXX@c.us
        jid:
          type: string
          description: e.g., 905XXXXXXXX@s.whatsapp.net (will be normalized)
        phone:
          type: string
          description: Digits-only or +E164; converted to chatId
        text:
          type: string
          description: Raw text (optional if template_id/pool_id/campaign_id provided)
        template_id:
          type: integer
          description: Use a specific WhatsAppTemplate
        pool_id:
          type: integer
          description: Pick a random template from this pool
        campaign_id:
          type: integer
          description: Use this campaign's pool/fallback settings
        lead_id:
          type: integer
          description: Use lead fields for {{business_name}}, etc.
        business_name:
          type: string
        category:
          type: string
        website:
          type: string
        dry_run:
          type: boolean
          default: true
          description: When true, do not send; only preview payload
        link_preview:
          type:
          - boolean
          - 'null'
        link_preview_high_quality:
          type:
          - boolean
          - 'null'
        reply_to:
          type:
          - string
          - 'null'
    WhatsAppCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        job_id:
          type: integer
          writeOnly: true
        template_pool_id:
          type:
          - integer
          - 'null'
          writeOnly: true
        template_pool:
          type: integer
          readOnly: true
        text_template:
          type: string
          description: Fallback template if pool is empty. Supports {{business_name}},
            {{category}}, {{website}}.
        media_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        throttle_per_minute:
          type: integer
          description: Max messages per minute
        delay_min_ms:
          type: integer
          description: Minimum delay between sends (ms)
        delay_max_ms:
          type: integer
          description: Maximum delay between sends (ms)
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsAppCampaignStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - job_id
      - name
      - status
      - template_pool
      - updated_at
    WhatsAppCampaignRecipient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lead_id:
          type: integer
          readOnly: true
        rendered_text:
          type: string
          readOnly: true
        template_id:
          type: integer
          readOnly: true
        media_url:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WhatsAppCampaignRecipientStatusEnum'
          readOnly: true
        message_id:
          type:
          - string
          - 'null'
          readOnly: true
        error:
          type:
          - string
          - 'null'
          readOnly: true
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - error
      - id
      - lead_id
      - media_url
      - message_id
      - rendered_text
      - sent_at
      - status
      - template_id
    WhatsAppCampaignRecipientStatusEnum:
      enum:
      - pending
      - sent
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `sent` - Sent
        * `failed` - Failed
    WhatsAppCampaignStatusEnum:
      enum:
      - draft
      - running
      - done
      - failed
      type: string
      description: |-
        * `draft` - Draft
        * `running` - Running
        * `done` - Done
        * `failed` - Failed
    WhatsAppTemplate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pool:
          allOf:
          - $ref: '#/components/schemas/WhatsAppTemplatePool'
          readOnly: true
        pool_id:
          type: integer
          writeOnly: true
        text:
          type: string
          description: Template text. Supports {{business_name}}, {{category}}, {{website}}.
        media_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        weight:
          type: integer
          description: Weight for random selection
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - pool
      - pool_id
      - text
